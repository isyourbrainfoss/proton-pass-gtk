name: Rust and Flatpak
on:
  push:
    branches: [main, feat/rust]
    # A v* tag builds both arches and publishes them to the shared signed Flatpak repo.
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev xvfb
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Adaptive UI, clipboard ownership and 30-second expiry
        run: PPG_BACKEND=mock PPG_SIZE=360x720 GTK_A11Y=none GDK_BACKEND=x11 GSK_RENDERER=cairo xvfb-run -a cargo test --locked --bin proton-pass-gtk -- --ignored --test-threads=1
  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.gnome.Platform//51 org.gnome.Sdk//51 org.freedesktop.Sdk.Extension.rust-stable//26.08
      - name: Build offline in the sandbox
        run: flatpak-builder --user --force-clean --default-branch=stable --repo=flatpak-repo flatpak-build build-aux/flatpak/io.github.isyourbrainfoss.ProtonPassGtk.json
      - name: Create bundle
        run: |
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo io.github.isyourbrainfoss.ProtonPassGtk-${{ matrix.arch }}.flatpak \
            io.github.isyourbrainfoss.ProtonPassGtk stable
          sha256sum io.github.isyourbrainfoss.ProtonPassGtk-${{ matrix.arch }}.flatpak \
            > io.github.isyourbrainfoss.ProtonPassGtk-${{ matrix.arch }}.flatpak.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: proton-pass-gtk-${{ matrix.arch }}
          path: io.github.isyourbrainfoss.ProtonPassGtk-${{ matrix.arch }}.flatpak*

  # On a v* tag: attach both bundles to the GitHub Release and tell isyourbrainfoss/flatpak,
  # which imports, signs and serves them at https://isyourbrainfoss.github.io/flatpak/.
  # No signing key lives in this repo.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: proton-pass-gtk-*
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum -c ./*.sha256
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ./*.flatpak ./*.sha256 -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" ./*.flatpak ./*.sha256 -R "$GITHUB_REPOSITORY" \
              --title "Proton Pass GTK $TAG" --generate-notes
          fi
      - name: Notify isyourbrainfoss/flatpak
        env:
          DISPATCH_TOKEN: ${{ secrets.FLATPAK_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::notice::FLATPAK_DISPATCH_TOKEN not set; the shared repo picks this release up on its weekly or a manual run."
            exit 0
          fi
          GH_TOKEN="$DISPATCH_TOKEN" gh api repos/isyourbrainfoss/flatpak/dispatches \
            -f event_type=app-updated \
            -F 'client_payload[app]=io.github.isyourbrainfoss.ProtonPassGtk' \
            -F "client_payload[tag]=$TAG"
